<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Things Done</title>
<style>
  :root{
    /* —— 配色 —— */
    --plum:   #7D2A5F;   /* 梅子紫 */
    --pink:   #E7A5C0;   /* 复古粉 */
    --sage:   #9CAEB4;   /* 雾蓝灰 */
    --olive:  #86A03E;   /* 橄榄绿 */
    --ink:    #5C6B70;   /* 深灰蓝 */
    --cream:  #F4F0E8;   /* 奶白底 */
    --paper:  #FDFBF6;   /* 纸面白 */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    /* 左粉右蓝的对撞背景 */
    background-image:
      linear-gradient(115deg,
        var(--pink) 0 26%,
        transparent 26%),
      linear-gradient(295deg,
        var(--sage) 0 18%,
        transparent 18%),
      linear-gradient(var(--cream),var(--cream));
    background-attachment:fixed;
  }

  .wrap{max-width:920px;margin:0 auto;padding:48px 20px 80px}

  /* ===== 头部：logo 式标题 ===== */
  header{margin-bottom:36px}
  .logo{font-size:30px;font-weight:800;letter-spacing:1px;color:var(--plum)}
  .logo small{
    color:var(--ink);font-weight:700;font-size:20px;margin-left:4px;
  }
  .sub{font-size:13px;letter-spacing:1.5px;color:var(--ink);opacity:.7;margin-top:8px}

  /* ===== 输入区 ===== */
  .composer{
    background:var(--paper);
    border-radius:14px;
    padding:18px 18px 14px;
    box-shadow:0 12px 30px rgba(92,107,112,.14);
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  }
  .composer input[type=text]{
    flex:1;min-width:200px;border:none;outline:none;
    font-size:16px;background:transparent;color:var(--ink);
    border-bottom:2px solid #e5ddcf;padding:8px 2px;
  }
  .composer input::placeholder{color:#b9b0a0}

  /* 颜色选择 */
  .swatches{display:flex;gap:8px}
  .swatch{
    width:26px;height:26px;border-radius:50%;cursor:pointer;border:none;
    position:relative;transition:transform .15s;
  }
  .swatch:hover{transform:scale(1.15)}
  .swatch.active::after{
    content:"";position:absolute;inset:-5px;border:2px solid var(--ink);border-radius:50%;
  }
  .sw-plum{background:var(--plum)} .sw-pink{background:var(--pink)}
  .sw-sage{background:var(--sage)} .sw-olive{background:var(--olive)}

  .add-btn{
    background:var(--plum);color:#fff;border:none;cursor:pointer;
    padding:10px 22px;border-radius:8px;font-size:14px;font-weight:700;letter-spacing:1px;
    transition:background .2s,transform .1s;
  }
  .add-btn:hover{background:#68204e}
  .add-btn:active{transform:scale(.97)}

  /* ===== 筛选 & 统计 ===== */
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin:26px 2px 14px;flex-wrap:wrap;gap:10px}
  .filters{display:flex;gap:6px}
  .chip{
    border:1.5px solid var(--ink);background:transparent;color:var(--ink);
    padding:5px 14px;border-radius:999px;font-size:12.5px;cursor:pointer;letter-spacing:.5px;
    transition:all .15s;
  }
  .chip.active{background:var(--ink);color:var(--cream);border-color:var(--ink)}
  .stats{font-size:13px;letter-spacing:1px}
  .stats b{color:var(--plum)}

  /* ===== 任务卡片 ===== */
  ul{list-style:none;display:flex;flex-direction:column;gap:14px}
  .task{
    background:var(--paper);border-radius:12px;padding:15px 18px 15px 20px;
    display:flex;align-items:center;gap:14px;
    box-shadow:0 6px 18px rgba(92,107,112,.10);
    position:relative;overflow:hidden;
    animation:pop .25s ease;
    transition:opacity .3s,transform .3s;
  }
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .task.removing{opacity:0;transform:translateX(30px)}

  /* 左侧色条 */
  .task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px}
  .task[data-c=plum]::before {background:var(--plum)}
  .task[data-c=pink]::before {background:var(--pink)}
  .task[data-c=sage]::before {background:var(--sage)}
  .task[data-c=olive]::before{background:var(--olive)}

  /* 自定义勾选框 */
  .cb{width:22px;height:22px;flex:none;cursor:pointer;position:relative}
  .cb input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer}
  .cb .box{
    position:absolute;inset:0;border-radius:6px;border:2px solid var(--ink);
    display:grid;place-items:center;transition:all .2s;font-size:13px;color:var(--paper);
  }
  .task[data-c=plum] .cb .box{border-color:var(--plum)}
  .task[data-c=pink] .cb .box{border-color:#c97fa3}
  .task[data-c=sage] .cb .box{border-color:#7d939b}
  .task[data-c=olive] .cb .box{border-color:#6e8530}

  .task.done[data-c=plum] .cb .box{background:var(--plum)}
  .task.done[data-c=pink] .cb .box{background:#c97fa3}
  .task.done[data-c=sage] .cb .box{background:#7d939b}
  .task.done[data-c=olive] .cb .box{background:#6e8530}

  .task .text{flex:1;font-size:15.5px;line-height:1.45;word-break:break-word;transition:color .2s}
  .task.done .text{color:#b3aa9a;text-decoration:line-through}
  .task .cat{
    font-size:11px;letter-spacing:1.5px;padding:3px 10px;border-radius:999px;color:#fff;flex:none;
  }
  .cat-plum{background:var(--plum)} .cat-pink{background:#d58aad}
  .cat-sage{background:#8ba0a7}   .cat-olive{background:#7a9335}

  .del{
    border:none;background:transparent;color:#c4bbaa;font-size:18px;cursor:pointer;
    padding:4px 8px;border-radius:6px;transition:all .15s;flex:none;
  }
  .del:hover{color:var(--plum);background:rgba(125,42,95,.08)}

  /* 空状态 */
  .empty{text-align:center;padding:60px 0;color:#b3aa9a;letter-spacing:2px;font-size:14px}
  .empty .dot-row{display:flex;justify-content:center;gap:10px;margin-bottom:18px}
  .empty .dot{width:12px;height:12px;border-radius:50%}
</style>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#E7A5C0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="完成">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Things Done<small id="ym"></small></div>
    <div class="sub">Delete the apps, cancel the noise, do the work.</div>
  </header>

  <div class="composer">
    <input type="text" id="input" placeholder="写下一件要做的事…" maxlength="80">
    <div class="swatches" id="swatches">
      <button class="swatch sw-plum active" data-c="plum"  title="重要"></button>
      <button class="swatch sw-pink"        data-c="pink"  title="日常"></button>
      <button class="swatch sw-sage"        data-c="sage"  title="不急"></button>
      <button class="swatch sw-olive"       data-c="olive" title="灵感"></button>
    </div>
    <button class="add-btn" id="add">添加</button>
  </div>

  <div class="toolbar">
    <div class="filters" id="filters">
      <button class="chip active" data-f="all">全部</button>
      <button class="chip" data-f="todo">进行中</button>
      <button class="chip" data-f="done">已完成</button>
    </div>
    <div class="stats">已完成 <b id="doneCount">0</b> / <span id="totalCount">0</span> 件</div>
  </div>

  <ul id="list"></ul>
</div>

<script>
const CATS = {
  plum: {name:"重要"},
  pink: {name:"日常"},
  sage: {name:"不急"},
  olive:{name:"灵感"},
};
let tasks = JSON.parse(localStorage.getItem("todo-tasks") || "[]");
let curColor = "plum", curFilter = "all";

const $ = s => document.querySelector(s);
const list = $("#list"), input = $("#input");

/* ===== 标题跟随系统时间：年.月 ===== */
function updateYM(){
  const n = new Date();
  const ym = `${n.getFullYear()}.${String(n.getMonth()+1).padStart(2,"0")}`;
  $("#ym").textContent = ym;
  document.title = `Things Done ${ym}`;
}
updateYM();
setInterval(updateYM, 30000);   // 跨月/跨年自动更新

function save(){ localStorage.setItem("todo-tasks", JSON.stringify(tasks)); render(); }

function render(){
  const shown = tasks.filter(t =>
    curFilter==="all" || (curFilter==="done" ? t.done : !t.done));
  list.innerHTML = "";
  if(!shown.length){
    list.innerHTML = `<div class="empty">
      <div class="dot-row">
        <div class="dot" style="background:#7D2A5F"></div>
        <div class="dot" style="background:#E7A5C0"></div>
        <div class="dot" style="background:#9CAEB4"></div>
        <div class="dot" style="background:#86A03E"></div>
      </div>还没有内容，添加第一条吧
    </div>`;
  }
  shown.forEach(t=>{
    const li = document.createElement("li");
    li.className = "task" + (t.done ? " done":"");
    li.dataset.c = t.color;
    li.innerHTML = `
      <label class="cb"><input type="checkbox" ${t.done?"checked":""}>
        <span class="box">✓</span></label>
      <span class="text">${t.text.replace(/</g,"&lt;")}</span>
      <span class="cat cat-${t.color}">${CATS[t.color].name}</span>
      <button class="del" title="删除">✕</button>`;
    li.querySelector("input").onchange = ()=>{ t.done=!t.done; save(); };
    li.querySelector(".del").onclick = ()=>{
      li.classList.add("removing");
      setTimeout(()=>{ tasks.splice(tasks.indexOf(t),1); save(); },280);
    };
    list.appendChild(li);
  });
  $("#doneCount").textContent = tasks.filter(t=>t.done).length;
  $("#totalCount").textContent = tasks.length;
}

function add(){
  const v = input.value.trim();
  if(!v) { input.focus(); return; }
  tasks.unshift({text:v, color:curColor, done:false, id:Date.now()});
  input.value = ""; save(); input.focus();
}
$("#add").onclick = add;
input.addEventListener("keydown", e=>{ if(e.key==="Enter") add(); });

// 颜色选择
document.querySelectorAll(".swatch").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll(".swatch").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); curColor = b.dataset.c;
  };
});
// 筛选
document.querySelectorAll(".chip").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));
    b.classList.add("active"); curFilter = b.dataset.f; render();
  };
});

render();
</script>
</body>
</html>
